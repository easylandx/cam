<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📸 EasyCamera</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f0f1a;
            color: #ddd;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            max-width: 500px;
            padding: 40px 20px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 8px;
            color: #a0b0ff;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 40px;
            opacity: 0.8;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            width: 100%;
        }

        li {
            margin: 14px 0;
        }

        a {
            display: block;
            padding: 18px 24px;
            background-color: #1f1f33;
            color: #e0e0ff;
            text-decoration: none;
            font-size: 1.25rem;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        a:hover {
            background-color: #2a2a44;
            color: white;
            transform: scale(1.03);
            border-color: #6a7cff;
        }

        .footer {
            margin-top: 50px;
            font-size: 0.9rem;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📷 EasyCamera</h1>

            EasyLandX • GitHub Pages
